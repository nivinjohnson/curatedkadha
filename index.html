<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curated Kadha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260905b" />
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <header class="topbar">
    <div class="banner-img-wrap">
      <img src="static/Banner.jpeg" alt="Curated Kadha Banner" class="banner-img" />
      <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <div id="navDropdownMenu" class="nav-dropdown-menu" aria-hidden="true">
        <a href="#/home" class="nav-dropdown-item" id="navShopBtn">Home</a>
        <a href="#/products" class="nav-dropdown-item" id="navProductsBtn">Products</a>
        <a href="#/size-chart" class="nav-dropdown-item" id="navSizeChartBtn">Size Chart</a>
        <a href="#/about" class="nav-dropdown-item" id="navAboutBtn">About Us</a>
      </div>
      <a class="brand-wrap" href="#/home">
        <span class="brand">Curated Kadha</span>
        <span class="brand-subtitle">Every piece tells a thoughtfully crafted story!</span>
        <span class="brand-subtitle">From NZ with love and yes, we ship your faves ✨</span>
      </a>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <template id="loadingTemplate">
    <section class="initial-loader" role="status" aria-label="Loading catalog">
      <span class="spinner spinner-initial" aria-hidden="true"></span>
    </section>
  </template>

  <template id="errorTemplate">
    <section class="panel">
      <h1>Could not load catalog</h1>
      <p id="errorText"></p>
      <p>Run a local server from this folder (for example <code>python -m http.server 8000</code>) and open <code>http://localhost:8000</code>.</p>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    window.CK_CONFIG = {
      // secureOrderApiUrl: "https://your-api-host.example.com/api/send-order-email"
    };
  </script>
  <script src="app.js?v=20260905b"></script>
</body>
</html>
