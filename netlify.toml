[build]
  functions = "netlify/functions"

[functions]
  included_files = ["data_from_insta/*.xlsx", "static/data_from_insta/*.xlsx", "product_info/*.xlsx"]

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "node_modules/nodemailer/lib/well-known/services.json"

[[redirects]]
  from = "/api/product-catalog"
  to = "/.netlify/functions/product-catalog"
  status = 200

[[redirects]]
  from = "/api/send-order-email"
  to = "/.netlify/functions/send-order-email"
  status = 200

[[redirects]]
  from = "/api/create-stripe-session"
  to = "/.netlify/functions/create-stripe-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/stripe-session-status"
  to = "/.netlify/functions/stripe-session-status"
  status = 200
